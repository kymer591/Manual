<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuales Institucionales - ITARFA y Tribunal de Justicia</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&family=Great+Vibes&family=Roboto+Slab:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           VARIABLES GLOBALES Y RESET
           ========================================== */
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #e53e3e;
            --gold-color: #b8860b;
            --bg-light: #f7fafc;
            --text-dark: #2d3748;
            --text-light: #718096;
            --white: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.7;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ==========================================
           CONTENEDOR PRINCIPAL
           ========================================== */
        .main-container {
            max-width: 1100px;
            width: 100%;
            background: var(--white);
            box-shadow: var(--shadow);
            border-radius: var(--border-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
        }

        /* ==========================================
           PESTAÑAS DE NAVEGACIÓN
           ========================================== */
        .tabs {
            display: flex;
            background: var(--primary-color);
            border-bottom: 4px solid #0f2440;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 18px 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            position: relative;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .tab-button i {
            margin-right: 8px;
            font-size: 1.1rem;
        }

        .tab-button:hover {
            background: #2c5282;
            color: var(--white);
        }

        .tab-button.active {
            background: var(--white);
            color: var(--primary-color);
            border-top: 4px solid var(--accent-color);
            font-weight: 700;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-color);
        }

        /* ==========================================
           CONTENIDO DE LAS VENTANAS
           ========================================== */
        .tab-content {
            display: none;
            padding: 40px;
            background: var(--white);
            animation: fadeIn 0.6s ease;
            flex: 1;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           ESTILOS COMUNES PARA LOS 3 DOCUMENTOS
           ========================================== */
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .doc-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .doc-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            color: var(--secondary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .doc-header .subtitle {
            font-size: 1rem;
            color: var(--text-light);
            font-style: italic;
            margin-top: 10px;
        }

        .doc-header .author {
            font-weight: 700;
            color: var(--gold-color);
            margin-top: 15px;
            font-size: 1.1rem;
        }

        h2.section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2.section-title i {
            color: var(--secondary-color);
            font-size: 1.5rem;
        }

        h3.subsection-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: var(--secondary-color);
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            margin-bottom: 15px;
            text-align: justify;
            color: #4a5568;
        }

        /* ==========================================
           MARCO DE IMÁGENES (PLACEHOLDER VISUAL)
           ========================================== */
        .image-frame {
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            border: 3px dashed #a0aec0;
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
            color: var(--text-light);
            transition: all 0.3s ease;
            min-height: 200px;
            position: relative;
            overflow: hidden;
        }

        .image-frame::before {
            content: '\f03e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 2.5rem;
            color: #cbd5e0;
            margin-bottom: 10px;
        }

        .image-frame:hover {
            border-color: var(--secondary-color);
            background: #ebf8ff;
            transform: translateY(-3px);
        }

        .image-frame .caption {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 5px;
        }

        .image-frame.gold-border {
            border-color: var(--gold-color);
            background: #fffff0;
        }

        .image-frame.gold-border::before {
            color: var(--gold-color);
        }

        .image-frame.green-border {
            border-color: #38a169;
            background: #f0fff4;
        }

        .image-frame.green-border::before {
            color: #38a169;
        }

        .image-frame.red-border {
            border-color: var(--accent-color);
            background: #fff5f5;
        }

        .image-frame.red-border::before {
            color: var(--accent-color);
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        /* ==========================================
           DOCUMENTO 1: MANUAL DE IMAGEN (TRIBUNAL)
           ========================================== */
        .doc-tribunal {
            background: #fdfaf5; /* Fondo crema suave */
            padding: 30px;
            border-radius: var(--border-radius);
            border: 1px solid #f0e6d2;
        }

        .doc-tribunal .cover {
            text-align: center;
            padding: 40px 20px;
            background: #fffdf8;
            border-radius: var(--border-radius);
            border: 4px solid #0d5c63;
            box-shadow: 0 8px 20px rgba(13, 92, 99, 0.1);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .doc-tribunal .cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #0d5c63, #b8860b, #8b0000);
        }

        .doc-tribunal .cover .logo-placeholder {
            width: 120px;
            height: 120px;
            background: #0d5c63;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            border: 5px solid #b8860b;
        }

        .doc-tribunal .cover h1 {
            font-family: 'Great Vibes', cursive;
            color: #8b0000;
            font-size: 2.8rem;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .doc-tribunal .cover h2 {
            color: #0d5c63;
            font-size: 1.4rem;
            text-transform: uppercase;
            margin-top: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .doc-tribunal .cover .author {
            color: #b8860b;
            font-size: 1.1rem;
            margin-top: 15px;
            font-weight: 600;
        }

        .doc-tribunal .cover .location {
            color: #b8860b;
            font-weight: bold;
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .doc-tribunal h2.section-title {
            border-bottom-color: #0d5c63;
            color: #0d5c63;
        }

        .doc-tribunal h2.section-title i {
            color: #b8860b;
        }

        .doc-tribunal .qualities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .doc-tribunal .quality-card {
            background: #fff;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #b8860b;
            transition: transform 0.3s;
        }

        .doc-tribunal .quality-card:hover {
            transform: translateY(-5px);
        }

        .doc-tribunal .quality-card .icon {
            font-size: 2rem;
            color: #0d5c63;
            margin-bottom: 10px;
        }

        .doc-tribunal .quality-card h4 {
            color: #0d5c63;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================
           DOCUMENTO 2: PROPUESTA ANA (ITARFA)
           ========================================== */
        .doc-itarfa {
            background: #eef2f7;
            padding: 30px;
            border-radius: var(--border-radius);
        }

        .doc-itarfa .cover {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border-top: 6px solid #3182ce;
        }

        .doc-itarfa .cover .logo-placeholder {
            width: 150px;
            height: 150px;
            background: #1a365d;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            border: 4px solid #e53e3e;
        }

        .doc-itarfa .cover h1 {
            font-family: 'Playfair Display', serif;
            color: #1a365d;
            font-size: 2.2rem;
            margin: 20px 0;
        }

        .doc-itarfa .cover .subtitle {
            font-size: 1.2rem;
            color: #2b6cb0;
            font-weight: 600;
        }

        .doc-itarfa .cover .author {
            font-weight: 700;
            color: #e53e3e;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .doc-itarfa h2.section-title {
            color: #1a365d;
            border-bottom-color: #3182ce;
        }

        .doc-itarfa h2.section-title i {
            color: #3182ce;
        }

        .doc-itarfa .step-box {
            background: #fff;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #3182ce;
            transition: transform 0.2s;
        }

        .doc-itarfa .step-box:hover {
            transform: translateX(5px);
        }

        .doc-itarfa .step-box strong {
            color: #3182ce;
            font-size: 1.05rem;
        }

        .doc-itarfa .step-box .image-frame {
            margin-top: 15px;
            min-height: 150px;
        }

        /* ==========================================
           DOCUMENTO 3: MANUAL DE PROCEDIMIENTOS (ACADEMIA CAROLINA)
           ========================================== */
        .doc-carolina {
            font-family: 'Roboto Slab', serif;
            color: #2d3748;
            background: #ffffff;
            padding: 30px;
            border-radius: var(--border-radius);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .doc-carolina .cover {
            text-align: center;
            padding: 50px 30px;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
            border-radius: var(--border-radius);
            margin-bottom: 40px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .doc-carolina .cover::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .doc-carolina .cover .logo-placeholder {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px solid #b8860b;
            color: #b8860b;
        }

        .doc-carolina .cover h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .doc-carolina .cover h2 {
            font-size: 1.1rem;
            font-weight: 400;
            margin-top: 10px;
            font-style: italic;
            color: #bee3f8;
        }

        .doc-carolina .cover .gold-line {
            width: 80px;
            height: 3px;
            background: #b8860b;
            margin: 20px auto;
        }

        .doc-carolina h2.section-title {
            font-family: 'Playfair Display', serif;
            color: #1a365d;
            border-bottom: 3px solid #b8860b;
            padding-bottom: 10px;
        }

        .doc-carolina h2.section-title i {
            color: #b8860b;
        }

        .doc-carolina h3.subsection-title {
            font-family: 'Roboto Slab', serif;
            color: #2c5282;
            font-size: 1.15rem;
            border-left: 4px solid #b8860b;
            padding-left: 12px;
        }

        .doc-carolina ul, .doc-carolina ol {
            padding-left: 25px;
            margin-bottom: 20px;
        }

        .doc-carolina ul li, .doc-carolina ol li {
            margin-bottom: 8px;
            color: #4a5568;
        }

        .doc-carolina ul li::marker {
            color: #b8860b;
            font-weight: bold;
        }

        .doc-carolina table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 25px 0;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .doc-carolina th, .doc-carolina td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .doc-carolina th {
            background: #1a365d;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .doc-carolina tr:last-child td {
            border-bottom: none;
        }

        .doc-carolina tr:nth-child(even) {
            background: #f7fafc;
        }

        .doc-carolina tr:hover {
            background: #ebf8ff;
        }

        .doc-carolina .checklist {
            list-style: none;
            padding-left: 0;
        }

        .doc-carolina .checklist li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            background: #f7fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #b8860b;
        }

        .doc-carolina .checklist li::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: #38a169;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .doc-carolina .checklist li span {
            font-weight: 600;
            color: #2d3748;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .tab-content {
                padding: 20px;
            }
            .doc-header h1 {
                font-size: 1.6rem;
            }
            .doc-tribunal .cover h1 {
                font-size: 2rem;
            }
            .doc-itarfa .cover h1 {
                font-size: 1.6rem;
            }
            .doc-carolina .cover h1 {
                font-size: 1.3rem;
            }
            .tab-button {
                padding: 12px 15px;
                font-size: 0.8rem;
            }
            .tab-button i {
                display: block;
                margin: 0 auto 5px;
            }
            table {
                font-size: 0.85rem;
            }
            th, td {
                padding: 10px;
            }
        }
    </sty
